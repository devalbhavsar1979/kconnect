# ============================================================
# Alembic Configuration
# NOTE: sqlalchemy.url is overridden by alembic/env.py
#       using DATABASE_URL from .env — do not change it here.
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder — alembic/env.py reads DATABASE_URL from settings
sqlalchemy.url = postgresql+psycopg://user:password@localhost/kconnect_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
